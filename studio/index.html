<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Playbooks Studio</title>
<style>
@font-face{font-family:Inter;src:url(/file/fonts/InterVariable.ttf);font-weight:100 900}
:root{
  --bg:#17171d;--grid:#2a2a33;--panel:#202028;--panel2:#282831;--card:#2b2b35;--line:#3a3a46;
  --text:#ececf1;--muted:#9b9bab;--dim:#6d6d7c;
  --trigger:#ff9f43;--code:#4dabf7;--ai:#b197fc;--human:#f783ac;--publish:#51cf66;
  --run:#4dabf7;--ok:#51cf66;--err:#ff6b6b;--wait:#fcc419;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:7px 12px}
button:hover{border-color:#55556a}
button.primary{background:#ff6d5a;border-color:#ff6d5a;color:#fff;font-weight:600}
button.go{background:#2f9e44;border-color:#2f9e44;color:#fff;font-weight:600}
button.danger{color:#ffa8a8}
button:disabled{opacity:.45;cursor:default}
select,input,textarea{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
a{color:#8fb8ff}
header{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:800;letter-spacing:-.3px;font-size:16px;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#ff6d5a,#b197fc);display:inline-block}
.pill{font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.pill b{color:var(--text);font-weight:600}
.grow{flex:1}
#banner{display:none;align-items:center;gap:12px;padding:9px 16px;background:#3b3212;border-bottom:1px solid #6b5a14;color:#ffe066}
#banner.on{display:flex}
main{display:flex;height:calc(100% - 56px);position:relative}
body.has-banner main{height:calc(100% - 56px - 45px)}

/* sidebar */
aside{width:380px;min-width:380px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;color:var(--muted);padding:12px 6px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:#ff6d5a}
.side-head{padding:12px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.side-head select{flex:1;min-width:0}
.list{flex:1;overflow:auto;padding:12px}
.note{font-size:12.5px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:9px 11px;margin-bottom:10px}
.cand{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px}
.cand.chosen{border-color:#2f9e44}
.cand .top{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:11.5px;color:var(--muted)}
.score{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#111;background:var(--wait);flex:none}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.6px;padding:2px 7px;border-radius:5px;background:#3a2f5c;color:#d0bfff}
.tag.news{background:#123a52;color:#a5d8ff}
.cand h4{font-size:14.5px;line-height:1.3;margin-bottom:6px}
.cand p{font-size:13px;color:#cfcfda;margin-bottom:6px}
.cand .why{color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
.chip{font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:#cfcfda}
.srcs{font-size:12px;margin-bottom:9px;display:flex;flex-wrap:wrap;gap:4px 10px}
.cand button{width:100%}
.raw{padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.raw small{color:var(--muted);display:block}
.tier{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-right:5px;background:#1f3b2b;color:#8ce99a}
.tier.signal{background:#3b3212;color:#ffe066}.tier.community{background:#3a2323;color:#ffa8a8}
.hist{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.hist small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 16px;font-size:13px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #4dabf755;border-top-color:var(--run);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* canvas */
#vp{flex:1;position:relative;overflow:hidden;cursor:grab;
  background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:#4a4a58;stroke-width:2.2}
#edges path.done{stroke:#2f9e44}
#edges path.flow{stroke:var(--run);stroke-dasharray:7 7;animation:flow .6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.group{position:absolute;white-space:nowrap;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.group span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--dim);margin-left:8px}
.node{position:absolute;width:224px;height:78px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  display:flex;align-items:center;gap:11px;padding:0 12px;cursor:pointer;user-select:none;transition:border-color .2s,box-shadow .2s}
.node:hover{border-color:#6a6a80}
.node.sel{box-shadow:0 0 0 3px #ff6d5a88}
.node .ico{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:22px;flex:none;background:#ffffff0d;border:1px solid}
.node.k-trigger .ico{border-color:var(--trigger);background:#ff9f4318}
.node.k-code .ico{border-color:var(--code);background:#4dabf718}
.node.k-ai .ico{border-color:var(--ai);background:#b197fc18}
.node.k-human .ico{border-color:var(--human);background:#f783ac18}
.node.k-publish .ico{border-color:var(--publish);background:#51cf6618}
.node .tx{min-width:0}
.node b{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:142px}
.node .badge{position:absolute;right:-9px;top:-9px;width:22px;height:22px;border-radius:50%;display:none;place-items:center;font-size:12px;font-weight:800;color:#111}
.node.s-done{border-color:#2f9e44}
.node.s-done .badge{display:grid;background:var(--ok)}
.node.s-done .badge:after{content:"✓"}
.node.s-error{border-color:var(--err)}
.node.s-error .badge{display:grid;background:var(--err)}
.node.s-error .badge:after{content:"!"}
.node.s-error small{color:#ffa8a8}
.node.s-waiting{border-color:var(--wait);animation:pulse 1.6s ease-in-out infinite}
.node.s-waiting .badge{display:grid;background:var(--wait)}
.node.s-waiting .badge:after{content:"⏸";font-size:10px}
.node.s-waiting small{color:#ffe066}
.node.s-running{border-color:var(--run);box-shadow:0 0 0 4px #4dabf722,0 0 24px #4dabf744}
.node.s-running .badge{display:grid;background:var(--panel);border:2px solid #4dabf755;border-top-color:var(--run);animation:sp .8s linear infinite}
.node.s-running small{color:#a5d8ff}
.node.s-idle{opacity:.72}
@keyframes pulse{50%{box-shadow:0 0 0 6px #fcc41922}}
.port{position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--panel);border:2px solid #5a5a6c}
.port.in{left:-6.5px}.port.out{right:-6.5px}
.zoom{position:absolute;left:14px;bottom:14px;display:flex;gap:6px}
.zoom button{width:34px;height:34px;padding:0;background:var(--panel)}
.legend{position:absolute;right:14px;bottom:14px;display:flex;gap:12px;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.runinfo{position:absolute;left:14px;top:14px;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;max-width:60%}
.runinfo b{color:var(--text)}

/* drawer */
#drawer{position:absolute;right:0;top:0;bottom:0;width:460px;border-left:1px solid var(--line);background:var(--panel);display:none;flex-direction:column;z-index:5;box-shadow:-12px 0 30px #0006}
#drawer.on{display:flex}
.dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dh .ico{font-size:22px}
.dh h3{font-size:15px;flex:1}
.db{flex:1;overflow:auto;padding:14px 16px}
.db h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 7px}
.db h5:first-child{margin-top:0}
.kv{font-size:13px;color:#cfcfda}
.kv span{color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
pre.log{background:#131318;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;color:#cfcfda}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs img{width:100%;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
video{width:100%;border-radius:10px;background:#000;max-height:520px}
ul.clean{padding-left:18px;font-size:13px;color:#cfcfda}
ul.clean li{margin-bottom:4px}

/* modal */
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(1180px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.mbox.small{width:min(460px,100%)}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.mh h2{font-size:17px;flex:1}
.mb{padding:18px 20px;overflow:auto}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.apv{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px}
.apv>div{min-width:0}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.strip img{height:340px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.cap{white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:12px;font-size:13.5px}
.qa{border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.qa.ok{background:#1f3b2b;color:#b2f2bb}.qa.bad{background:#3a2323;color:#ffc9c9}
#revise{display:none;width:100%;gap:8px;flex-direction:column}
#revise.on{display:flex}
#revise textarea{width:100%;min-height:70px}
#lightbox{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
#lightbox.on{display:flex}
#lightbox img{max-width:94vw;max-height:94vh;border-radius:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#3a2323;color:#ffc9c9;border:1px solid #6b3030;padding:10px 16px;border-radius:10px;z-index:70;display:none}
.toast.on{display:block}
.times{display:flex;flex-direction:column;gap:8px}
.times div{display:flex;gap:8px}
.tcards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.tcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.tcard small{display:block;font-size:11.5px;color:var(--muted)}
.tcard b{font-size:20px;font-weight:750;letter-spacing:-.3px}
.tcard.main{border-color:#ff6d5a88}
table.tt{width:100%;border-collapse:collapse;font-size:13px}
table.tt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tt tr.ph td{padding-top:14px;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid #4a4a58}
table.tt td.n{white-space:nowrap}
table.tt td.d{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;width:90px}
table.tt td.p{text-align:right;color:var(--muted);width:48px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:#3a3a46;overflow:hidden;min-width:160px}
.bar i{display:block;height:100%;border-radius:5px}
.tnote{font-size:12px;color:var(--muted);margin-top:12px}
.switch{display:flex;align-items:center;gap:10px;margin-top:16px;cursor:pointer}
.switch input{width:18px;height:18px}
@media (max-width:1100px){aside{width:300px;min-width:300px}#drawer{width:360px}.apv{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>AI Playbooks Studio</div>
  <span class="pill" id="nextScan">…</span>
  <span class="pill" id="gatePill"></span>
  <div class="grow"></div>
  <select id="postSel" title="Gösterilen üretim"></select>
  <button id="timeBtn" title="Adım adım süre dökümü">⏱ Süreler</button>
  <button class="primary" id="scanBtn">⟳ Şimdi tara</button>
  <button id="setBtn" title="Ayarlar">⚙</button>
</header>
<div id="banner"><span id="bannerTxt"></span><button id="bannerBtn">Önizle ve onayla</button></div>
<main>
  <aside>
    <div class="tabs">
      <button data-tab="cands" class="on">Adaylar</button>
      <button data-tab="raw">Ham haberler</button>
      <button data-tab="hist">Geçmiş</button>
    </div>
    <div class="side-head" id="scanHead"><select id="scanSel"></select></div>
    <div class="list" id="list"></div>
  </aside>
  <div id="vp">
    <div id="world"><svg id="edges"></svg></div>
    <div class="runinfo" id="runinfo"></div>
    <div class="zoom"><button id="zin">+</button><button id="zout">−</button><button id="zfit" title="Ekrana sığdır">⤢</button></div>
    <div class="legend"><span><i style="background:var(--trigger)"></i>tetik</span><span><i style="background:var(--code)"></i>script</span><span><i style="background:var(--ai)"></i>Claude</span><span><i style="background:var(--human)"></i>sen</span><span><i style="background:var(--publish)"></i>yayın</span></div>
  </div>
  <div id="drawer">
    <div class="dh"><span class="ico" id="dIco"></span><h3 id="dTitle"></h3><button id="dClose">✕</button></div>
    <div class="db" id="dBody"></div>
  </div>
</main>

<div class="modal" id="apModal"><div class="mbox">
  <div class="mh"><h2 id="apTitle">Önizleme</h2><button id="apClose">✕</button></div>
  <div class="mb" id="apBody"></div>
  <div class="mf">
    <button class="go" id="apGo">✓ Yayınla (Instagram + Facebook)</button>
    <button id="apRev">✎ Revize et</button>
    <button class="danger" id="apRej">✕ Reddet</button>
    <div class="grow"></div>
    <span class="pill" id="apState"></span>
    <div id="revise"><textarea id="revNote" placeholder="Ne değişsin? Örn: kapak başlığını kısalt, 3. slayttaki ipucunu değiştir, daha az teknik anlat…"></textarea>
      <div style="display:flex;gap:8px"><button class="primary" id="revSend">Revizyonu gönder</button><button id="revCancel">Vazgeç</button></div></div>
  </div>
</div></div>

<div class="modal" id="setModal"><div class="mbox small">
  <div class="mh"><h2>Ayarlar</h2><button id="setClose">✕</button></div>
  <div class="mb">
    <h5 style="font-size:12px;color:var(--muted);margin-bottom:8px">TARAMA SAATLERİ (her gün)</h5>
    <div class="times" id="times"></div>
    <button id="addTime" style="margin-top:8px">+ Saat ekle</button>
    <label class="switch"><input type="checkbox" id="gate"> Yayından önce onay iste</label>
    <p style="font-size:12.5px;color:var(--muted);margin-top:8px">Kapalıyken seçtiğin haber kontrol edilip doğrudan paylaşılır. Kalite kontrol bir sorun bulursa yine de onay istenir.</p>
  </div>
  <div class="mf"><button class="primary" id="setSave">Kaydet</button></div>
</div></div>

<div class="modal" id="tmModal"><div class="mbox" style="width:min(820px,100%)">
  <div class="mh"><h2 id="tmTitle">Süre dökümü</h2><button id="tmClose">✕</button></div>
  <div class="mb" id="tmBody"></div>
</div></div>

<div id="lightbox"><img alt=""></div>
<div class="toast" id="toast"></div>

<script>
const ICONS={trigger:"⏰",collect:"📰",scout:"🧠",choose:"👤",write:"✍️",carousel:"🖼️",reel:"🎬",qa:"👁️",approve:"✅",
  upload:"☁️",ig_carousel:"📸",ig_reel:"🎞️",fb_photos:"📘",fb_reel:"📘",yt_short:"▶️",log:"📒"};
const POS={trigger:[0,40],collect:[270,40],scout:[540,40],choose:[810,40],
  write:[0,230],carousel:[270,230],reel:[540,230],qa:[810,230],
  approve:[0,420],upload:[270,420],ig_carousel:[540,420],ig_reel:[810,420],
  fb_photos:[0,610],fb_reel:[270,610],yt_short:[540,610],log:[810,610]};
const GROUPS=[["① Tarama","scan",0,0],["② Üretim","post",0,190],["③ Onay & yayın","pub",0,380]];
const WW=810+224,WH=610+78;
const NW=224,NH=78;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch{return u}};
const fmtT=s=>s?new Date(s).toLocaleString("tr-TR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
const file=p=>"/file/"+p.split("/").map(encodeURIComponent).join("/");

let S=null, scanId=null, postId=null, tab="cands", sel=null, detail=null, dismissed=new Set(), built=false;
let view={x:40,y:40,k:1}, fitted=false;

async function api(path,body){
  const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});
  const j=r.headers.get("content-type")?.includes("json")?await r.json():await r.text();
  if(!r.ok) throw new Error(j.error||r.statusText);
  return j;
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),5000);}

const scans=()=>S.runs.filter(r=>r.kind==="scan");
const posts=()=>S.runs.filter(r=>r.kind==="post");
const runById=id=>S.runs.find(r=>r.id===id);
const flowOf=nid=>S.flows.scan.some(n=>n.id===nid)?"scan":"post";

/* ---------------- canvas ---------------- */
function build(){
  const w=$("#world");
  for(const [label,key,x,y] of GROUPS){
    const g=document.createElement("div");g.className="group";g.style.left=x+"px";g.style.top=y+"px";g.dataset.g=key;
    g.innerHTML=esc(label)+"<span></span>";w.appendChild(g);
  }
  for(const f of ["scan","post"]) for(const n of S.flows[f]){
    const d=document.createElement("div");d.className="node k-"+n.kind+" s-idle";d.id="n-"+n.id;
    const [x,y]=POS[n.id];d.style.left=x+"px";d.style.top=y+"px";
    d.innerHTML=`<div class="ico">${ICONS[n.id]}</div><div class="tx"><b>${esc(n.label)}</b><small>Bekliyor</small></div><span class="badge"></span><i class="port in"></i><i class="port out"></i>`;
    d.onclick=e=>{e.stopPropagation();openNode(n.id)};
    w.appendChild(d);
  }
  built=true;
}
const ORDER=()=>[...S.flows.scan,...S.flows.post].map(n=>n.id);
function edgePath(a,b){
  const [ax,ay]=POS[a],[bx,by]=POS[b];const x1=ax+NW,y1=ay+NH/2,x2=bx,y2=by+NH/2;
  if(x2>x1) {const c=Math.max(40,(x2-x1)/2);return `M${x1},${y1} C${x1+c},${y1} ${x2-c},${y2} ${x2},${y2}`;}
  const my=(y1+y2)/2+6,r=16;

const PH={scan:["Tarama","var(--trigger)"],wait:["Senin bekleme süren","var(--human)"],production:["Üretim","var(--ai)"],publish:["Yayın","var(--publish)"]};
const PHASE={trigger:"scan",collect:"scan",scout:"scan",choose:"wait",write:"production",carousel:"production",reel:"production",qa:"production",
  approve:"wait",upload:"publish",ig_carousel:"publish",ig_reel:"publish",fb_photos:"publish",fb_reel:"publish",yt_short:"publish",log:"publish"};
const secsOf=t=>t.started?Math.max(0,((t.ended?new Date(t.ended):new Date())-new Date(t.started))/1000):0;
function hms(s){s=Math.round(s);if(s<60)return s+" sn";const m=Math.floor(s/60),r=s%60;if(m<60)return m+" dk "+String(r).padStart(2,"0")+" sn";
  return Math.floor(m/60)+" sa "+String(m%60).padStart(2,"0")+" dk";}
function timingRows(){
  const po=runById(postId),sc=po?runById(po.scan):runById(scanId),rows=[];let first=null,last=null;
  for(const [r,f] of [[sc,"scan"],[po,"post"]]) if(r) for(const m of S.flows[f]){
    const n=r.nodes[m.id]||{status:"idle"},tries=[...(n.attempts||[]),...(n.started?[n]:[])];
    for(const t of tries){if(!t.started)continue;const e=t.ended||new Date().toISOString();
      if(!first||t.started<first)first=t.started;if(!last||new Date(e)>new Date(last))last=e;}
    rows.push({id:m.id,label:m.label,phase:PHASE[m.id],secs:tries.reduce((a,t)=>a+secsOf(t),0),tries:tries.length,status:n.status});
  }
  return {po,sc,rows,wall:first?(new Date(last)-new Date(first))/1000:0};
}
function renderTimings(){
  const {po,sc,rows,wall}=timingRows();
  $("#tmTitle").textContent="Süre dökümü"+(po?" · "+(po.title||""):sc?" · tarama "+fmtT(sc.created):"");
  if(!rows.length){$("#tmBody").innerHTML=`<div class="empty">Henüz ölçülecek bir iş yok.</div>`;return;}
  const tot=k=>rows.filter(r=>r.phase===k).reduce((a,r)=>a+r.secs,0);
  const machine=tot("scan")+tot("production")+tot("publish"),max=Math.max(...rows.map(r=>r.secs),1);
  const live=rows.some(r=>r.status==="running"||r.status==="waiting");
  let h=`<div class="tcards">
    <div class="tcard main"><small>Toplam (baştan sona)</small><b>${hms(wall)}</b></div>
    <div class="tcard"><small>Makine süresi</small><b>${hms(machine)}</b></div>
    <div class="tcard"><small>Senin bekleme süren</small><b>${hms(tot("wait"))}</b></div>
    <div class="tcard"><small>Durum</small><b style="font-size:15px">${po?statusTr(po.status):statusTr(sc.status)}${live?' <span class="spin"></span>':""}</b></div></div>
   <table class="tt">`;
  for(const ph of ["scan","wait","production","publish"]){
    const rs=rows.filter(r=>r.phase===ph);if(!rs.length)continue;
    const order=ph==="wait"?["choose","approve"]:null;
    h+=`<tr class="ph"><td colspan="2">${PH[ph][0]}</td><td class="d">${hms(tot(ph))}</td><td class="p">${machine+tot("wait")?Math.round(tot(ph)*100/(machine+tot("wait"))):0}%</td></tr>`;
    for(const r of (order?order.map(i=>rs.find(x=>x.id===i)).filter(Boolean):rs)){
      const st={running:" ▶",waiting:" ⏸",error:" !"}[r.status]||"";
      h+=`<tr><td class="n">${ICONS[r.id]} ${esc(r.label)}${r.tries>1?` <span class="pill" style="padding:1px 7px">${r.tries} deneme</span>`:""}${st}</td>
        <td><div class="bar"><i style="width:${(r.secs/max*100).toFixed(1)}%;background:${PH[ph][1]}"></i></div></td>
        <td class="d">${r.tries?hms(r.secs):"—"}</td><td class="p">${r.tries&&machine+tot("wait")?Math.round(r.secs*100/(machine+tot("wait"))):""}${r.tries?"%":""}</td></tr>`;
    }
  }
  h+=`</table><p class="tnote">Toplam = taramanın başladığı andan son adımın bittiği (ya da şu) ana kadar geçen süre. Makine süresi = sistemin çalıştığı süre;
    bekleme = haberi seçmen ve onay vermen için geçen süre. Tekrar denenen/revize edilen adımlarda tüm denemeler sayılır. Her iş bitince döküm <b>stats/timings.jsonl</b> dosyasına kaydedilir.</p>`;
  $("#tmBody").innerHTML=h;
}
$("#timeBtn").onclick=()=>{renderTimings();$("#tmModal").classList.add("on")};
$("#tmClose").onclick=()=>$("#tmModal").classList.remove("on");

/* ---------------- main loop ---------------- */
function renderAll(forceSide){
  const sc=scans(),po=posts();
  if(!scanId||!runById(scanId))scanId=sc[0]?.id||null;
  if(!postId||!runById(postId))postId=(po.find(p=>["running","queued","waiting"].includes(p.status))||po[0])?.id||null;
  $("#scanSel").innerHTML=sc.length?sc.slice(0,12).map(r=>`<option value="${esc(r.id)}" ${r.id===scanId?"selected":""}>${fmtT(r.created)} · ${r.candidates?.candidates?r.candidates.candidates.length+" aday":statusTr(r.status)}</option>`).join(""):`<option>Henüz tarama yok</option>`;
  $("#postSel").innerHTML=po.length?po.slice(0,20).map(r=>`<option value="${esc(r.id)}" ${r.id===postId?"selected":""}>${{running:"▶",queued:"…",waiting:"⏸",done:"✓",error:"!",rejected:"✕",canceled:"■"}[r.status]||""} ${esc((r.title||r.id).slice(0,60))}</option>`).join(""):`<option>Henüz üretim yok</option>`;
  $("#nextScan").innerHTML=`Sonraki tarama <b>${fmtT(S.next_scan)}</b>`;
  $("#gatePill").innerHTML=`Onay: <b>${S.settings.approval?"açık":"kapalı"}</b>`;
  const wait=po.filter(p=>p.nodes.approve?.status==="waiting");
  $("#banner").classList.toggle("on",wait.length>0);document.body.classList.toggle("has-banner",wait.length>0);
  $("#bannerTxt").textContent=wait.length?`⏸ ${wait.length} gönderi onayını bekliyor: ${wait[0].title||""}`:"";
  const running=sc.some(r=>["running","queued"].includes(r.status));$("#scanBtn").disabled=running;$("#scanBtn").textContent=running?"Taranıyor…":"⟳ Şimdi tara";
  renderCanvas();renderSide(forceSide);
  if(sel)renderDrawer();
  if($("#tmModal").classList.contains("on"))renderTimings();
  const w=wait.find(p=>!dismissed.has(p.id));if(w&&!$("#apModal").classList.contains("on")){postId=w.id;renderCanvas();openApproval(w.id)}
}
async function refresh(){try{S=await api("/api/state");renderAll(false)}catch(e){toast("Studio'ya bağlanılamadı: "+e.message)}}
refresh();setInterval(refresh,2500);
</script>
